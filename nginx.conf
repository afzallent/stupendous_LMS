# -----------------------------------------------------------------------------
# ALTERNATIVE TOPOLOGY — NOT USED BY THE CURRENT DEPLOYMENT.
#
# This file (together with supervisord.conf) describes a single container
# running nginx + gunicorn + Next.js under supervisor. The live deployment
# described in DEPLOYMENT.md instead runs two separate Coolify applications
# (backend via /Dockerfile, frontend via /frontend/Dockerfile) with Coolify's
# own proxy in front, so nothing here is applied in production.
#
# Keep it only if you intend to move to the single-container topology;
# otherwise delete this file, supervisord.conf and nixpacks.toml.
# See PRODUCTION_READINESS.md (P2-10).
# -----------------------------------------------------------------------------

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # The upload API accepts videos up to 500 MB. nginx's default limit is 1 MB,
    # which would reject them with a 413 before Django ever saw the request.
    client_max_body_size 512M;
    client_body_timeout 300s;

    # Do not advertise the nginx version on error pages / headers.
    server_tokens off;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream backend {
        server 127.0.0.1:8000;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _;

        # API routes go to Django backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Large video uploads need headroom beyond the default 60s.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        # Django admin
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django static files
        location /static/ {
            alias /app/backend/staticfiles/;
        }

        # Django media files (user uploads)
        # These are attacker-influenced content served from the app's own
        # origin, so force download semantics and block script execution
        # rather than letting an uploaded .html or .svg run as first-party.
        location /media/ {
            alias /app/backend/media/;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Disposition "attachment" always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }

        # Everything else goes to Next.js frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
