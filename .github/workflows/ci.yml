name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Tests need DEBUG=True: settings.py deliberately refuses to import
      # without a SECRET_KEY when DEBUG=False.
      DEBUG: 'True'
      SECRET_KEY: ci-only-not-a-real-secret
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: lms_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_SSL_MODE: disable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for missing migrations
        # Two model fields (Lesson.duration, User.preferred_language) once
        # shipped without migrations, so the columns did not exist in any
        # deployed database. This gate stops that recurring.
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: pytest -q

  backend-deploy-check:
    name: Backend production config check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Verify production settings are hardened
        # Runs Django's deployment checklist against a production-shaped
        # config: catches a regression in HSTS, secure cookies, DEBUG, etc.
        env:
          DEBUG: 'False'
          SECRET_KEY: ci-only-not-a-real-secret
          ALLOWED_HOSTS: ci.example.com
          DB_ENGINE: django.db.backends.sqlite3
        run: python manage.py check --deploy --fail-level WARNING

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          # NEXT_PUBLIC_* is inlined at build time; the Dockerfile fails the
          # build when this is absent, so CI must supply it too.
          NEXT_PUBLIC_API_URL: https://ci.example.com
        run: pnpm build
