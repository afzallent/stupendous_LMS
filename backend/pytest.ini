[pytest]
DJANGO_SETTINGS_MODULE = lms_project.settings
python_files = tests.py test_*.py *_tests.py
addopts =
    --tb=short
    # These two are manual verification scripts meant to be piped into
    # `manage.py shell`, not pytest tests. They execute database queries at
    # import time, which aborts collection for the whole suite.
    --ignore=test_activity_signals.py
    --ignore=test_quiz_endpoints.py

# Several apps each define a module literally named `tests`. Without this,
# pytest's default "prepend" import mode cannot tell core/tests.py from
# courses/tests.py and fails collection with an import-file-mismatch error.
importmode = importlib

# NOTE: run with DEBUG=True in the environment. settings.py deliberately
# refuses to import without a SECRET_KEY when DEBUG=False
# (see PRODUCTION_READINESS.md P0-8), so use:
#     DEBUG=True pytest
