{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Lessons for: {{ course.title }}</h1>
    <div>
        <a href="{% url 'instructor_dashboard' %}" class="btn btn-outline-secondary me-2">Back to Dashboard</a>
        <a href="{% url 'add_lesson' course.id %}" class="btn btn-success">Add Lesson</a>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Order</th>
                <th>Title</th>
                <th>Video URL</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for lesson in lessons %}
            <tr>
                <td>{{ lesson.order }}</td>
                <td>{{ lesson.title }}</td>
                <td><a href="{{ lesson.video_url }}" target="_blank">Link</a></td>
                <td>
                    <!-- Future edit/delete buttons -->
                    <span class="text-muted">Edit</span>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4" class="text-center">No lessons added yet.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
