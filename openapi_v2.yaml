openapi: 3.0.3
info:
  title: CourseCompass LMS API
  description: |
    A comprehensive Learning Management System (LMS) API built with Django REST Framework.
    
    ## Features
    - JWT-based authentication with refresh tokens
    - User registration and profile management
    - Password reset functionality
    - Course creation and management for instructors
    - Student enrollment and progress tracking
    - Lesson completion tracking
    - Coupon system for discounts
    - Admin-configurable email settings
    
    ## Authentication
    Most endpoints require authentication using JWT Bearer tokens.
    
    ### Getting Started
    1. Register: `POST /api/auth/register/`
    2. Login: `POST /api/auth/login/`
    3. Use the returned `access` token in the Authorization header: `Bearer {token}`
    4. Refresh token when expired: `POST /api/auth/token/refresh/`
    
  version: 2.0.0
  contact:
    name: CourseCompass API Support
    email: api-support@coursecompass.com
    url: https://docs.coursecompass.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: Development server
  - url: https://api.coursecompass.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication, registration, and password reset
  - name: User Profile
    description: User profile management and settings
  - name: Courses
    description: Course management and browsing
  - name: Lessons
    description: Lesson management and completion tracking
  - name: Enrollments
    description: Student course enrollments
  - name: Progress
    description: Student progress tracking
  - name: Dashboard
    description: Student and instructor dashboards
  - name: Categories
    description: Course categories
  - name: Coupons
    description: Discount coupon management

security:
  - BearerAuth: []

paths:
  /api/auth/register/:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 150
                  example: john_doe
                email:
                  type: string
                  format: email
                  example: john@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecurePass123
                is_student:
                  type: boolean
                  default: true
                is_instructor:
                  type: boolean
                  default: false
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                    description: JWT access token
                  refresh:
                    type: string
                    description: JWT refresh token
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/auth/login/:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate user and receive JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: john_doe
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
                  refresh:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/token/refresh/:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Get a new access token using refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
                  description: JWT refresh token
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: string
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout/:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh
              properties:
                refresh:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Successfully logged out.
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/request-password-reset/:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email with token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: If an account with that email exists, a password reset link has been sent.
        '400':
          description: Invalid email format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/auth/reset-password/:
    post:
      tags:
        - Authentication
      summary: Reset password
      description: Reset password using token from email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uid
                - token
                - new_password
              properties:
                uid:
                  type: string
                  description: User ID from reset link
                token:
                  type: string
                  description: Reset token from email
                new_password:
                  type: string
                  format: password
                  minLength: 8
                  example: NewSecurePass123
      responses:
        '200':
          description: Password reset successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Password has been reset successfully.
        '400':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/user/me/:
    get:
      tags:
        - User Profile
      summary: Get current user profile
      description: Retrieve authenticated user's profile information
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    
    patch:
      tags:
        - User Profile
      summary: Update user profile
      description: Update authenticated user's profile information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                bio:
                  type: string
                phone:
                  type: string
                location:
                  type: string
                website:
                  type: string
                  format: uri
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/user/change-password/:
    post:
      tags:
        - User Profile
      summary: Change password
      description: Change password for authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                    example: Password changed successfully.
        '400':
          description: Invalid old password or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/user/upload-avatar/:
    post:
      tags:
        - User Profile
      summary: Upload avatar
      description: Upload user profile picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Image file (max 5MB, JPEG/PNG/GIF/WebP)
      responses:
        '200':
          description: Avatar uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  avatar_url:
                    type: string
                    format: uri
        '400':
          description: Invalid file
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /api/courses/:
    get:
      tags:
        - Courses
      summary: List courses
      description: Get paginated list of published courses
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Search in title and description
        - name: category
          in: query
          schema:
            type: integer
          description: Filter by category ID
        - name: instructorId
          in: query
          schema:
            type: integer
          description: Filter by instructor ID
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCourseList'
    
    post:
      tags:
        - Courses
      summary: Create course
      description: Create a new course (instructors only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/courses/{id}/:
    get:
      tags:
        - Courses
      summary: Get course detail
      description: Get detailed information about a course
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetail'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/courses/{id}/with-progress/:
    get:
      tags:
        - Courses
      summary: Get course with progress
      description: Get course details with student progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: studentId
          in: query
          schema:
            type: integer
          description: View specific student's progress (instructors only)
      responses:
        '200':
          description: Course with progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseWithProgress'
        '403':
          description: Not enrolled in course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/courses/{id}/publish/:
    post:
      tags:
        - Courses
      summary: Publish course
      description: Publish a draft course (instructor only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Course published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/lessons/:
    get:
      tags:
        - Lessons
      summary: List lessons
      description: Get list of lessons for a course
      parameters:
        - name: course_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of lessons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
    
    post:
      tags:
        - Lessons
      summary: Create lesson
      description: Create a new lesson (course instructor only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LessonCreate'
      responses:
        '201':
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'

  /api/lessons/{id}/mark-complete/:
    post:
      tags:
        - Lessons
      summary: Mark lesson complete
      description: Mark a lesson as completed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lesson marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string
                  progress:
                    type: object
                    properties:
                      completed:
                        type: boolean
                      completed_at:
                        type: string
                        format: date-time
                  course_progress:
                    type: object
                    properties:
                      completed_lessons:
                        type: integer
                      total_lessons:
                        type: integer
                      percentage:
                        type: integer
                      course_completed:
                        type: boolean

  /api/enrollments/:
    post:
      tags:
        - Enrollments
      summary: Enroll in course
      description: Enroll current user in a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - course_id
              properties:
                course_id:
                  type: integer
      responses:
        '201':
          description: Enrolled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
        '400':
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/enrollments/check/:
    get:
      tags:
        - Enrollments
      summary: Check enrollment
      description: Check if user is enrolled in a course
      parameters:
        - name: courseId
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Enrollment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_enrolled:
                    type: boolean

  /api/student/dashboard/:
    get:
      tags:
        - Dashboard
      summary: Get student dashboard
      description: Get student's enrolled courses with progress
      responses:
        '200':
          description: Student dashboard data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboard'

  /api/instructor/analytics/:
    get:
      tags:
        - Dashboard
      summary: Get instructor analytics
      description: Get instructor's course statistics
      responses:
        '200':
          description: Instructor analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorAnalytics'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from login endpoint

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        is_student:
          type: boolean
        is_instructor:
          type: boolean
        is_staff:
          type: boolean

    UserProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            first_name:
              type: string
            last_name:
              type: string
            avatar:
              type: string
              format: uri
              nullable: true
            bio:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            location:
              type: string
              nullable: true
            website:
              type: string
              format: uri
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        instructor:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            email:
              type: string
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            slug:
              type: string
        thumbnail:
          type: string
          format: uri
          nullable: true
        price:
          type: string
        original_price:
          type: string
          nullable: true
        is_free:
          type: boolean
        status:
          type: string
          enum: [draft, published, archived]
        total_lessons:
          type: integer
        total_enrollments:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            lessons:
              type: array
              items:
                $ref: '#/components/schemas/Lesson'
            published_at:
              type: string
              format: date-time
              nullable: true

    CourseWithProgress:
      allOf:
        - $ref: '#/components/schemas/CourseDetail'
        - type: object
          properties:
            enrolled_at:
              type: string
              format: date-time
            progress_percentage:
              type: integer
            completed_lessons:
              type: integer
            next_lesson:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                title:
                  type: string
            is_instructor_view:
              type: boolean
            viewing_student:
              type: object
              nullable: true

    CourseCreate:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: integer
          nullable: true
        price:
          type: number
          format: decimal
        original_price:
          type: number
          format: decimal
          nullable: true
        is_free:
          type: boolean
        status:
          type: string
          enum: [draft, published, archived]

    Lesson:
      type: object
      properties:
        id:
          type: integer
        course:
          type: integer
        title:
          type: string
        order:
          type: integer
        video_url:
          type: string
          format: uri
          nullable: true
        video_file:
          type: string
          format: uri
          nullable: true
        content:
          type: string

    LessonCreate:
      type: object
      required:
        - course
        - title
        - order
      properties:
        course:
          type: integer
        title:
          type: string
        order:
          type: integer
        video_url:
          type: string
          format: uri
        content:
          type: string

    Enrollment:
      type: object
      properties:
        id:
          type: integer
        student:
          type: integer
        course:
          type: integer
        enrolled_at:
          type: string
          format: date-time

    StudentDashboard:
      type: object
      properties:
        enrolled_courses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              description:
                type: string
              instructor:
                type: string
              enrolled_at:
                type: string
                format: date-time
              total_lessons:
                type: integer
              completed_lessons:
                type: integer
              progress_percentage:
                type: integer
        total_courses:
          type: integer
        completed_courses:
          type: integer
        in_progress_courses:
          type: integer
        total_lessons_completed:
          type: integer

    InstructorAnalytics:
      type: object
      properties:
        total_courses:
          type: integer
        total_students:
          type: integer
        total_enrollments:
          type: integer
        total_lessons:
          type: integer
        courses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              enrollments:
                type: integer
              lessons:
                type: integer
              average_progress:
                type: number

    PaginatedCourseList:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Course'

    Error:
      type: object
      properties:
        detail:
          type: string

    ValidationError:
      type: object
      additionalProperties:
        type: array
        items:
          type: string

  responses:
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Authentication credentials were not provided.

    ForbiddenError:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: You do not have permission to perform this action.

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            detail: Not found.
