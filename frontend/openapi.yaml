              properties:
                totalEnrolled:
                  type: integer
                totalCompleted:
                  type: integer
                totalHours:
                  type: integer
                currentStreak:
                  type: integer
            achievements:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  icon:
                    type: string
                  earnedAt:
                    type: string

    # Progress Schema
    ProgressResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            properties:
              lessonId:
                type: string
              progressPercentage:
                type: number
              watchTime:
                type: integer
              completed:
                type: boolean
              lastPosition:
                type: integer

    # Instructor Schemas
    InstructorCoursesResponse:
