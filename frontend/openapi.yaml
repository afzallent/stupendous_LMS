                type: integer
        userEmail:
          type: string
          format: email
        userId:
          type: string

    UPICheckoutRequest:
      type: object
      required: [items, userEmail, userId, amount]
      properties:
        items:
          type: array
          items:
            type: object
        userEmail:
          type: string
          format: email
        userId:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: INR

    # Certificate Schema
    Certificate:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        courseId:
          type: string
        certificateUrl:
          type: string
        certificateId:
          type: string
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        revokedAt:
          type: string
          format: date-time
          nullable: true
        revocationReason:
          type: string
          nullable: true

    # System Schemas
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
        courses:
          type: integer

    PlatformStat:
      type: object
      properties:
        icon:
          type: string
        label:
          type: string
        value:
          type: string
        color:
          type: string

    # Common Response Schemas
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              path:
                type: array
                items:
                  type: string

tags:
  - name: System
    description: System health and configuration
  - name: Authentication
    description: User authentication and session management
  - name: Courses
    description: Course management and browsing
  - name: Enrollments
    description: Course enrollment management
  - name: Students
    description: Student-specific endpoints
  - name: Instructors
    description: Instructor/Trainer-specific endpoints
  - name: Admin
    description: Administrative functions (Admin only)
  - name: Payments
    description: Payment processing (Stripe & UPI)
  - name: File Upload
    description: File upload and media management
  - name: Certificates
    description: Certificate generation and verification
  - name: File Serving
    description: Static file serving

  # Quiz/Assessment System Endpoints
  /instructor/quiz/create:
    post:
      tags: [Quiz]
      summary: Create a new quiz for a lesson
      description: Instructors can create quizzes with multiple question types
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - lessonId
                - questions
              properties:
                title:
                  type: string
                  example: "Module 1 Assessment"
                description:
                  type: string
                  example: "Test your understanding of JavaScript basics"
                passingScore:
                  type: integer
                  default: 70
                  example: 80
                lessonId:
                  type: string
                  example: "clp123abc"
                timeLimit:
                  type: integer
                  description: Time limit in minutes
                  example: 30
                randomizeQuestions:
                  type: boolean
                  default: false
                showExplanations:
                  type: boolean
                  default: true
                allowRetakes:
                  type: boolean
                  default: true
                maxRetakes:
                  type: integer
                  example: 3
                questions:
                  type: array
                  items:
                    type: object
                    required:
                      - question
                      - type
                      - correctAnswer
                      - points
                    properties:
                      question:
                        type: string
                        example: "What is the capital of France?"
                      type:
                        type: string
                        enum: [MULTIPLE_CHOICE, TRUE_FALSE, FILL_IN_THE_BLANK, MULTIPLE_ANSWER]
                        example: "MULTIPLE_CHOICE"
                      options:
                        type: array
                        items:
                          type: string
                        example: ["Paris", "London", "Berlin", "Madrid"]
                      correctAnswer:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                        example: "Paris"
                      points:
                        type: integer
                        example: 1
                      explanation:
                        type: string
                        example: "Paris has been the capital of France since 987 AD"
                      order:
                        type: integer
                        example: 0
      responses:
        '200':
          description: Quiz created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  quiz:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "clq456def"
                      title:
                        type: string
                      questionCount:
                        type: integer
                      totalPoints:
                        type: integer
                      courseId:
                        type: string
                      courseName:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags: [Quiz]
      summary: Get existing quiz for a lesson
      description: Retrieve quiz details for editing
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: lessonId
          in: query
          required: true
          schema:
            type: string
          description: The ID of the lesson
      responses:
        '200':
          description: Quiz details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz:
                    type: object
                    nullable: true

  /student/quiz/{quizId}:
    get:
      tags: [Quiz]
      summary: Get quiz for student to take
      description: Retrieve quiz questions without correct answers
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the quiz
      responses:
        '200':
          description: Quiz retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      passingScore:
                        type: integer
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            question:
                              type: string
                            type:
                              type: string
                            options:
                              type: array
                              items:
                                type: string
                            points:
                              type: integer
                      metadata:
                        type: object
                      course:
                        type: object
                      lesson:
                        type: object
                  previousAttempts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        score:
                          type: number
                        maxScore:
                          type: number
                        passed:
                          type: boolean
                        completedAt:
                          type: string
                          format: date-time
                  attemptCount:
                    type: integer
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'

  /student/quiz/submit:
    post:
      tags: [Quiz]
      summary: Submit quiz answers
      description: Submit student answers and receive automatic scoring
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quizId
                - answers
              properties:
                quizId:
                  type: string
                  example: "clq456def"
                answers:
                  type: array
                  items:
                    type: object
                    required:
                      - questionId
                      - answer
                    properties:
                      questionId:
                        type: string
                        example: "clr789ghi"
                      answer:
                        oneOf:
                          - type: string
                          - type: array
                            items:
                              type: string
                        example: "Paris"
      responses:
        '200':
          description: Quiz submitted and scored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  attempt:
                    type: object
                    properties:
                      id:
                        type: string
                      score:
                        type: number
                        example: 8
                      maxScore:
                        type: number
                        example: 10
                      passed:
                        type: boolean
                        example: true
                      percentageScore:
                        type: string
                        example: "80.0"
                      completedAt:
                        type: string
                        format: date-time
                  detailedResults:
                    type: array
                    nullable: true
                    description: Only provided if showExplanations is enabled
                    items:
                      type: object
                      properties:
                        questionId:
                          type: string
                        question:
                          type: string
                        userAnswer:
                          oneOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                        correctAnswer:
                          oneOf:
                            - type: string
                            - type: array
                              items:
                                type: string
                        isCorrect:
                          type: boolean
                        points:
                          type: integer
                        maxPoints:
                          type: integer
                        explanation:
                          type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Forbidden - Retakes not allowed or maximum attempts exceeded
        '404':
          $ref: '#/components/responses/NotFound'

  /instructor/quiz/bank:
    get:
      tags: [Quiz]
      summary: Get question bank for instructor
      description: Retrieve all questions created by the instructor across courses
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: courseId
          in: query
          schema:
            type: string
          description: Filter by course
        - name: type
          in: query
          schema:
            type: string
            enum: [MULTIPLE_CHOICE, TRUE_FALSE, FILL_IN_THE_BLANK, MULTIPLE_ANSWER]
          description: Filter by question type
        - name: search
          in: query
          schema:
            type: string
          description: Search in question text
      responses:
        '200':
          description: Questions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        question:
                          type: string
                        type:
                          type: string
                        points:
                          type: integer
                        courseName:
                          type: string
                        lessonName:
                          type: string
                        quizTitle:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  total:
                    type: integer

  /instructor/quiz/{quizId}/results:
    get:
      tags: [Quiz]
      summary: Get quiz results and analytics
      description: View all student attempts and performance analytics
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Quiz results retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  quiz:
                    type: object
                  attempts:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        studentName:
                          type: string
                        studentEmail:
                          type: string
                        score:
                          type: number
                        maxScore:
                          type: number
                        passed:
                          type: boolean
                        completedAt:
                          type: string
                          format: date-time
                  analytics:
                    type: object
                    properties:
                      totalAttempts:
                        type: integer
                      averageScore:
                        type: number
                      passRate:
                        type: number
                      medianScore:
                        type: number
                      questionPerformance:
                        type: array
                        items:
                          type: object
                          properties:
                            questionId:
                              type: string
                            correctRate:
                              type: number
                            averagePoints:
                              type: number

