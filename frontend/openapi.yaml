                  title:
                    type: string
                  description:
                    type: string
                  status:
                    type: string
                  students:
                    type: integer
                  revenue:
                    type: number
                  rating:
                    type: number
                  completionRate:
                    type: integer
                  totalLessons:
                    type: integer
                  duration:
                    type: string
                  category:
                    type: string
                  price:
                    type: number
                  created:
                    type: string
                  lastUpdated:
                    type: string
                  thumbnail:
                    type: string
            stats:
              type: object
              properties:
                totalStudents:
                  type: integer
                totalRevenue:
                  type: number
                totalCourses:
                  type: integer
                publishedCourses:
                  type: integer
                averageRating:
                  type: number
                completionRate:
                  type: integer

    InstructorAnalyticsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            overview:
              type: object
              properties:
                totalRevenue:
                  type: number
                totalStudents:
                  type: integer
                totalCourses:
                  type: integer
                averageRating:
                  type: number
            revenueChart:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  amount:
                    type: number
            enrollmentChart:
              type: array
              items:
                type: object
                properties:
                  date:
                    type: string
                  enrollments:
                    type: integer

    # Admin Schemas
    AdminUsersResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            users:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                  avatar:
                    type: string
                  status:
                    type: string
                  joinDate:
                    type: string
                  lastActive:
                    type: string
                  coursesEnrolled:
                    type: integer
                  coursesCreated:
                    type: integer
                  totalSpent:
                    type: number
                  totalRevenue:
                    type: number
                  totalReviews:
                    type: integer
            pagination:
              type: object
              properties:
                page:
                  type: integer
                limit:
                  type: integer
                total:
                  type: integer
                pages:
                  type: integer

    UpdateUserRequest:
      type: object
      required: [userId, action]
      properties:
        userId:
          type: string
        status:
          type: string
          enum: [active, suspended, banned]
        role:
          type: string
          enum: [STUDENT, TRAINER, ADMIN]
        action:
          type: string
          enum: [activate, suspend, ban, change_role]

    # Payment Schemas
    StripeCheckoutRequest:
      type: object
      required: [items, userEmail, userId]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              price:
                type: number
              instructor:
                type: string
              thumbnail:
                type: string
              level:
                type: string
              duration:
                type: string
